# Tempest on a single server: the futures bot always on, the lab run by cron,
# and optionally FreqAI (Freqtrade's self-retraining ML bot) on other pairs.
# Secrets live in /etc/tempest on the server, never in this repo.
name: tempest

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  bot:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: tempest:latest
    # bot.env holds secrets and the owner's risk settings; settings.env (in
    # git) comes second, so its trading settings win.
    env_file:
      - /etc/tempest/bot.env
      - settings.env
    # The day's drawdown baseline and halt (risk-state.json), so a deploy
    # does not lift a halt. STATE_DIR defaults to this path.
    volumes:
      - /var/lib/tempest/bot:/var/lib/tempest
    restart: unless-stopped
    logging: *logging

  # Meme-coin paper test: no keys, no money; reads DexScreener and RugCheck
  # and writes to /var/lib/tempest/meme. Started by deploy.sh.
  meme:
    image: tempest:latest
    # Only TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID, copied from bot.env by
    # deploy.sh: this container never sees the exchange keys.
    env_file: /etc/tempest/meme.env
    environment:
      MODE: memepaper
      MEME_DIR: /data
    volumes:
      - /var/lib/tempest/meme:/data
    # Never more than one CPU and 1.5 GB, so it cannot slow the trading bot.
    cpus: 1.0
    mem_limit: 1536m
    restart: unless-stopped
    logging: *logging

  # Not started by `up`; cron runs it with `docker compose run --rm lab`.
  lab:
    image: tempest:latest
    env_file: /etc/tempest/lab.env
    profiles: ["lab"]
    restart: "no"
    logging: *logging

  # Freqtrade + FreqAI, live on its own pairs (never Tempest's: Tempest adopts
  # any position on its pairs). Started by deploy.sh only once
  # /etc/tempest/freqai-secrets.json exists.
  freqai:
    image: freqtradeorg/freqtrade:2026.10_freqai
    profiles: ["freqai"]
    restart: unless-stopped
    volumes:
      - /var/lib/tempest/freqai:/freqtrade/user_data
      - ./freqai/strategies:/freqtrade/user_data/strategies:ro
      - ./freqai/config.json:/freqtrade/config/config.json:ro
      - /etc/tempest/freqai-secrets.json:/freqtrade/config/secrets.json:ro
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/config/config.json
      --config /freqtrade/config/secrets.json
      --strategy TempestFreqAI
      --freqaimodel LightGBMRegressor
    logging: *logging
